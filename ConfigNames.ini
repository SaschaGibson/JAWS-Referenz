regex:https:\/\/docs.google.com\/spreadsheets\/.*\/pubhtml=
;Published slides
regex:https:\/\/docs.google.com\/presentation\/.*\/pub.*=
regex:https:\/\/docs.google.com\/.*presentation\/.*\/htmlpresent=
;Published Forms
regex:https:\/\/docs.google.com\/forms\/.*\/viewform=
regex:https:\/\/docs.google.com\/forms\/.*\/formResponse=
