;The following section defines the mapping between domain names and script sets.
;A script set includes JSB/JSS, JBS, JKM and JCF.
[Domains]
;This is a list of domains along with a script set to be loaded if the domain matches.
;This list is processed in order so the first entry in  the list that matches is the one that will be selected.
;If a line begins with with regex: then everything after the : up to the last = is interpreted as a regular expression that is tested against the current URL.
;if the regex matches, then the script set after the last = is loaded.
;To keep JAWS from loading any specific script set, just leave the entry after the = blank, this will cause JAWS to load the default script set for the current browser.
;
dev.azure.com=AzureDevOps
;Uncomment the following entry and ensure it points to your specific SharePoint portal if you wish to use the SharePoint test script:
;fsservices-my.sharepoint.com=SharePointWeb
