; This file contains aliases for configuration sets.  If the executable name
; is not a desirable configuration name, then put an alias in this file.  When
; the application focus changes, JAWS will read the executable name and check
; it against this file.  If a match is found, then the match will be used.
; Otherwise, JAWS will just use the executable filename.

[ConfigNames]
; exeName:version=configurationName
; - exeName is the file's name without the extension.
; - version is the file's major and minor version or just the major version,
;     without preceding zeros.  The version is optional and can be left out if
;     the alias is not version-specific.
; - configurationName is the name of the configuration set which will be loaded.

